name: Dependency versions

# Prints the published versions of the libraries TandemWear uses, straight from
# Google Maven / Maven Central metadata, so versions are never guessed.
# Runs when this file changes, or manually.
on:
  push:
    branches:
      - claude/dazzling-heisenberg-ttxsvg
    paths:
      - .github/workflows/dependency-versions.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Maven metadata
        run: |
          google() {
            local path="$1"
            local xml
            xml=$(curl -fsSL "https://dl.google.com/android/maven2/$path/maven-metadata.xml") || { echo "$path: NOT FOUND"; return; }
            local all stable
            all=$(echo "$xml" | grep -o '<version>[^<]*' | sed 's/<version>//')
            stable=$(echo "$all" | grep -v -E 'alpha|beta|rc|dev' | tail -3 | tr '\n' ' ')
            echo "$path: latest=$(echo "$all" | tail -1)  stable=[$stable]"
          }
          google androidx/wear/compose/compose-material3
          google androidx/wear/compose/compose-foundation
          google androidx/wear/compose/compose-navigation
          google androidx/wear/compose/compose-ui-tooling
          google androidx/wear/tiles/tiles
          google androidx/wear/tiles/tiles-tooling-preview
          google androidx/wear/protolayout/protolayout
          google androidx/wear/protolayout/protolayout-material3
          google androidx/wear/protolayout/protolayout-expression
          google androidx/wear/watchface/watchface-complications-data-source-ktx
          google androidx/wear/wear
          google androidx/datastore/datastore-preferences
          google androidx/concurrent/concurrent-futures
          google androidx/compose/compose-bom
          google androidx/activity/activity-compose
          google androidx/room/room-runtime
          google androidx/core/core-ktx
          google androidx/lifecycle/lifecycle-runtime-compose
          google com/android/tools/build/gradle
          central() {
            local path="$1"
            local all
            all=$(curl -fsSL "https://repo1.maven.org/maven2/$path/maven-metadata.xml" | grep -o '<version>[^<]*' | sed 's/<version>//') || { echo "$path: NOT FOUND"; return; }
            echo "$path: stable=[$(echo "$all" | grep -v -E 'alpha|beta|rc|RC|SNAPSHOT' | tail -3 | tr '\n' ' ')]"
          }
          central io/github/takahirom/roborazzi/roborazzi
          central io/github/takahirom/roborazzi/roborazzi-compose
          central io/github/takahirom/roborazzi/roborazzi-junit-rule
          central org/robolectric/robolectric
          curl -fsSL https://plugins.gradle.org/m2/io/github/takahirom/roborazzi/io.github.takahirom.roborazzi.gradle.plugin/maven-metadata.xml | grep -o '<release>[^<]*' || echo "roborazzi plugin: not on plugin portal"

      - name: Download API sources (for writing code against the real APIs)
        run: |
          mkdir -p sources
          get() {
            local group="$1" name="$2" version="$3"
            curl -fsSL -o "sources/$name-$version-sources.jar" \
              "https://dl.google.com/android/maven2/$group/$name/$version/$name-$version-sources.jar" \
              && echo "ok $name $version" || echo "MISSING $name $version"
          }
          get androidx/wear/compose compose-material3 1.6.2
          get androidx/wear/compose compose-foundation 1.6.2
          get androidx/wear/compose compose-navigation 1.6.2
          get androidx/wear/tiles tiles 1.6.2
          get androidx/wear/protolayout protolayout 1.4.2
          get androidx/wear/protolayout protolayout-material3 1.4.2
          get androidx/wear/protolayout protolayout-expression 1.4.2
          get androidx/wear/watchface watchface-complications-data-source 1.3.0
          get androidx/wear/watchface watchface-complications-data-source-ktx 1.3.0
          get androidx/wear/watchface watchface-complications-data 1.3.0
          get androidx/wear wear 1.4.0
          get androidx/datastore datastore-preferences-core 1.2.1

      - name: Print API signatures
        run: |
          sig() { echo "######## $1 / $2"; python3 .github/scripts/api_signatures.py "sources/$1-sources.jar" "$2"; }
          sig compose-material3-1.6.2 '^(AppScaffold|ScreenScaffold|EdgeButton|Button|ButtonDefaults|Card|ListHeader|SwitchButton|TimePicker|AlertDialog|Confirmation|IconButton|TimeText|ScrollIndicator|SwipeToReveal|Text|Icon|MaterialTheme|ColorScheme|Typography|ProgressIndicator|CircularProgressIndicator|Placeholder)\.kt$'
          sig compose-foundation-1.6.2 '^(TransformingLazyColumn|TransformingLazyColumnState|ScalingLazyColumn|ScalingLazyListState|SwipeToDismissBox|BasicSwipeToDismissBox)\.kt$'
          sig compose-navigation-1.6.2 '\.kt$'
          sig tiles-1.6.2 '^(TileService|TileUpdateRequester|EventBuilders|RequestBuilders|TileBuilders)\.java$|^TileService\.kt$'
          sig protolayout-material3-1.4.2 '^(MaterialScope|PrimaryLayout|Texts|Text|Buttons|Button|Cards|Card|Icons|Icon|ColorScheme|Typography)\.kt$'
          sig watchface-complications-data-source-ktx-1.3.0 '\.kt$'
          sig watchface-complications-data-source-1.3.0 '^(ComplicationDataSourceService|ComplicationDataSourceUpdateRequester|ComplicationRequest)\.(kt|java)$'
          sig watchface-complications-data-1.3.0 '^(Data|Text|Image)\.kt$'
          sig wear-1.4.0 '^Ambient'
          sig datastore-preferences-core-1.2.1 '\.kt$'

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: api-sources
          path: sources/
          retention-days: 7
